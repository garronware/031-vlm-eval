[project]
name = "vlm-eval"
version = "0.1.0"
description = "Evaluates how well frontier VLMs extract bounding dimensions from 2D engineering drawings"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pillow>=12.3.0",
    "anthropic>=1.7.0",
    "openai>=3.16.1",
    "google-genai>=2.24.0",
    "matplotlib>=3.11.2",
]

[project.scripts]
vlm-eval = "vlm_eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_eval"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
